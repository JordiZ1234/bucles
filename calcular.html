<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input id="calcular" type="number">
    <button id="btn">calcular</button>
    <div id="resu">
    </div>
    <script>
        let calcular = document.querySelector("#calcular")
        let btn = document.querySelector("#btn")
        let resu = document.querySelector("#resu")
        let resultado = 0
        function calculo(){
            for(let m=1 ;m<=10 ; m++){
            resultado = calcular.value * m
            resu.innerHTML+=(calcular.value + "x " +m+"="+resultado +"<br>")
        }
        }
        btn.addEventListener("click", calculo)
    </script>
</body>
</html>
