<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let edat = 18
        if (edat >= 18){
            console.log("Eres mayor edad")
        } else if (edat = 13 && 17) {
            console.log("Adolescente")
        } else if (edat < 13){
            console.log ("Eres menor")
        } else {
            console.log ("Edat no valida")
        }
    </script>
    <script>
        for (let m = 1; m <= 10; m++){
            console.log("Numero actual: " + m)
        }
    </script>
    <script>
        for (let i = 1; i <= 10; i++ ){
            let resultado = 5 * i
            console.log("5 x " + i + " = " + resultado)
        }
    </script>
    <script>
        for (let contador = 1; contador <= 12; contador++){
            if (contador < 5){
                console.log(contador + " Tram inicial");
            } else if ( contador < 10){
                console.log (contador + " Tram mitja");
            } else {
                console.log(contador + " Tram final")
            }
        }
    </script>
    <script>
        for (let tasca = 1; tasca <= 5; tasca++){
            console.log("Tasca " + tasca )
        }
    </script>
    <script>
        for(let h = 1; h <= 20; h++){
            if (h % 2 === 0){
                console.log (h + " es parell")
            }
        }
    </script>
</body>
</html>
